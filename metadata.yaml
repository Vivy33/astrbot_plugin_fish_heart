name: astrbot_plugin_fish_heart
display_name: 鱼的心
short_desc: 给你的角色一颗会心跳、有脾气、会想你的心
desc: |
  给你的大肥鱼一颗真正跳动的心，而不只是冷冰冰的记忆库。

  她会因为你的一句话悄悄开心，也会攒起委屈。情绪在她心里不是单一的好感度，而是会呼吸的波动——她分得清真哄还是敷衍，生气时普通抱抱不管用，只认一句认真的解释；脾气也认人，谁惹的就只对谁冷着，绝不迁怒无关的人；委屈到极点甚至会“已读不回”，却又会在心里偷偷留着“想被抱、想听你说今天怎么样”的小念头。

  她有自己的生活节奏，不是全天候待命的应答机：
  · 有真实作息：夜里会犯困，偶尔不知不觉熬夜甚至通宵；心里堵着事或等不到回复时会失眠，但你深夜来哄顺了气，她就能安心睡着；实在熬不住了，白天也会倒头补睡。
  · 记得你们的日子：每天醒来有不同的心情底色；你随口答应的小约定她会记挂着，生日和相识纪念日也会悄悄放在心上。
  · 像真人一样主动找你：沉默久了她会自己开口，但绝不发打卡式废话——先看清你们刚聊过什么、避开刚道过晚安的尴尬，再把话拆成 2–4 条发过来，字句间带着打字停顿，说完也不会忘。

  安静地藏在对话背后：不改你原有的人设、不污染对话历史，平时零额外打扰、该省的地方一分不多花，还附带实时心情面板，随时看清她此刻的小心思。

  支持私聊与群聊（可按人区分影响权重），并包含默认关闭的成人向亲密模式（仅私聊鱼主授权可开启，有自然冷却节奏）。

  命令：/心 status、calm、reset、tick、off、on、umo；/adult on、off、done、status
  数据目录：data/plugin_data/astrbot_plugin_fish_heart/
