name: astrbot_plugin_fish_heart
display_name: 鱼的心
short_desc: 给角色一颗跳动的心：九维驱动、跨会话心境注入、情绪驱动的主动说话
desc: |
  给你的大肥鱼一颗"跳动的心"，而不是一堆记忆。她会因为你的一句话高兴或委屈，会惦记一件没被回应的小事，也会在沉默太久之后自己开口——不是为了打卡，是因为她想你了。

  她由九维驱动（依恋、好奇、反刍、责任、社交、疲惫、亲密、压力、喜悦）加两条快变量（期待值、责怪压力）构成，分平静、委屈、害怕、回避四档，认得真哄，也认得敷衍。心境会写进系统提示词影响说话方式，但只在跨档时注入、且按会话各自节流。她心里会攒念头（想被夸、想被抱、想听你说今天怎么样），被满足后留下心情，凉掉则轻微回落。主动说话由情绪驱动：先读真实对话历史再开口，说完写回历史，不会"说完就忘"；多句时拆成 2–4 条发送，间隔 0.8–3.5 秒，像人在打字。私聊与群聊共享同一颗心，但只有白名单里的 QQ 号能改变她，群聊权重按"距上次私聊时长"衰减——别人说好话安抚不了她。开机补发不会突破睡眠时段，也不会在她"回避"状态下硬开口。

  命令：/心 status | reset | tick | off | on | umo
  数据目录：data/plugin_data/astrbot_plugin_fish_heart/
