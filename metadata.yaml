name: astrbot_plugin_fish_heart
display_name: 鱼的心
short_desc: 给你的角色一颗跳动的心：九维情绪、五档状态、主动开口
desc: |
  给你的大肥鱼一颗跳动的心，而不是一堆记忆。

  她会因为你的一句话高兴或委屈。九维情绪（依恋、好奇、反刍、责任、社交、疲惫、亲密、压力、喜悦）加期待、责怪两条快变量，落成日常、委屈、生气、害怕、回避五档。重责不会一步跳过生气，生气按人拆——A 惹的她不会撒到 B 头上。她认得真哄，也认得敷衍；生气时只认道歉或把话说清楚，普通抱抱不算。

  沉默太久，她会自己开口，但不是打卡：先读带时间线的真实对话，再决定说什么；和最近聊天矛盾就当场重写。说完写回历史，不会说完就忘；多句拆成 2–4 条，间隔像人在打字。

  心境写进本轮用户消息末尾，不改 system prompt、不回存历史，跨档必注、同档按会话节流——说话方式变了，前缀缓存没断。

  她心里会攒念头：想被夸、想被抱、想听你说今天怎么样。被满足会留下心情，凉掉则轻微回落。

  关系满格够久，会解锁隐藏的「欲」；成人层按状态打开，写法约束只在场景里注一次，完成后还会进入一段「贤者期」——欲大幅回落、暂时撩不动。群聊也能用：群友模式下所有人都能影响她，正负强度分开调；管理命令仍只对白名单里的鱼主开放。

  命令：/心 status、calm、reset、tick、off、on、umo；/adult on、off、status
  数据目录：data/plugin_data/astrbot_plugin_fish_heart/
