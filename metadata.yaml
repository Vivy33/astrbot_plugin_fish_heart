name: astrbot_plugin_fish_heart
display_name: 鱼的心
short_desc: 给角色一颗跳动的心：九维驱动、跨会话心境注入、情绪驱动的主动说话
desc: |
  给你的大肥鱼一颗"跳动的心"，而不是一堆记忆。她会因为你的一句话高兴或委屈，会惦记一件没被回应的小事，也会在沉默太久之后自己开口——不是为了打卡，是因为她想你了。

  她由九维驱动（依恋、好奇、反刍、责任、社交、疲惫、亲密、压力、喜悦）加两条快变量（期待值、责怪压力）构成，分日常（原来叫“平静”）、委屈、生气、害怕、回避五档，认得真哄，也认得敷衍；生气时只认道歉或"把话说清楚"，普通抱抱不算；重责不会从日常/委屈一步跳过生气，生气对象按人拆（A 惹的她不会撒到 B 头上）。进了回避档，她不只不主动开口，你连发的话也按阶梯接：前 5 条一律不回、第 6 条一半几率、第 7 条必回；这 7 条她会全记住，开口前先归纳再答（命令与真哄/道歉/说清楚必回）。心境会写进系统提示词影响说话方式：跨档必注，同档内按会话各自节流。她心里会攒念头（想被夸、想被抱、想听你说今天怎么样），被满足后留下心情，凉掉则轻微回落。主动说话由情绪驱动：先读带时间线的真实对话再开口（每条带 `[月-日 时:分]`，按先后排列），模板不诱导编近况，发送前还会检查草稿是否和最近聊天矛盾；说完写回历史，不会"说完就忘"；多句时拆成 2–4 条发送，间隔 0.8–3.5 秒，像人在打字。主动发送前会校验目标会话 UMO 必须是 `platform:MessageType:session_id` 三段，格式不对就跳过并写清原因，不会把裸 QQ 号/群号丢给 AstrBot。群聊里的 `/心` 只对 `perception.owner_ids` 中的鱼主开放（`/心 umo` 除外），`group_everyone` 不会放开命令权限。可选打开 `diagnostics.log_affect`，每条对话写一行 JSON 影响日志（原文、事件、实际增量、前后状态；含隐私，默认关闭）。状态栏分两层显示：心情（黏人/开心/累了/紧绷/走神/好奇/平常）+ 责怪档（日常/委屈/生气/害怕/回避）；“日常”只表示没在生气，不再叫“平静”。新增隐藏属性「欲」：依恋、亲密都到 80 并持续 24 小时才解锁，只在私聊鱼主生效，`/心 status` 不显示数值，WebUI 解锁后由「隐藏的欲」卡片显示；成人向身体层还要 `desire.adult_enabled` + 私聊鱼主 + 当前场景明确同意；`/adult on` 只是 24 小时预授权，不是必需。私聊与群聊共享同一颗心；默认只有白名单里的 QQ 号能改变她，群聊权重按"距上次私聊时长"衰减——别人说好话安抚不了她；打开群友模式（`group_everyone`）后群聊里所有人都能影响她，正向、负向强度分别由 `group_scale`（默认 0.5）、`group_negative_scale`（群友默认 0.35）和 `group_owner_negative_scale`（鱼主默认 0.5）控制。开机补发不会突破睡眠时段，也不会在她"回避"状态下硬开口。

  命令：/心 status | calm | reset | tick | off | on | umo；/adult on | off | status
  数据目录：data/plugin_data/astrbot_plugin_fish_heart/
